<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Order Confirmed | Payment Success</title>
    
    <!-- Fancybox v5 CSS CDN (Optional: Only if you want to launch it inside a popup modal) -->
    <link rel="stylesheet" href="https://jsdelivr.net"/>

    <style>
        /* Base Page Configurations */
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: #f3f4f6;
            color: #1f2937;
            margin: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
            box-sizing: border-box;
        }

        /* Success Card Wrapper */
        .success-card {
            background: #ffffff;
            max-width: 480px;
            width: 100%;
            border-radius: 20px;
            padding: 40px 32px;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.05);
            text-align: center;
            box-sizing: border-box;
            position: relative;
            overflow: hidden;
        }

        /* Animated Banner Accents */
        .success-card::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 6px;
            background: linear-gradient(90deg, #10b981, #34d399);
        }

        /* Animated Success Checkmark Ring */
        .icon-container {
            width: 72px;
            height: 72px;
            background-color: #ecfdf5;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 auto 24px auto;
            color: #10b981;
            animation: scaleIn 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards;
        }
        .icon-container svg {
            width: 36px;
            height: 36px;
        }

        /* Typography */
        .success-title {
            font-size: 1.5rem;
            font-weight: 700;
            color: #111827;
            margin: 0 0 8px 0;
        }
        .success-subtitle {
            font-size: 0.95rem;
            color: #6b7280;
            margin: 0 0 32px 0;
            line-height: 1.5;
        }

        /* Structured Invoice/Receipt Breakdowns */
        .receipt-panel {
            background-color: #f9fafb;
            border: 1px solid #f3f4f6;
            border-radius: 12px;
            padding: 20px;
            margin-bottom: 32px;
            text-align: left;
        }
        .receipt-row {
            display: flex;
            justify-content: space-between;
            margin-bottom: 12px;
            font-size: 0.9rem;
        }
        .receipt-row:last-child {
            margin-bottom: 0;
            padding-top: 12px;
            border-top: 1px dashed #e5e7eb;
        }
        .label {
            color: #6b7280;
        }
        .value {
            font-weight: 600;
            color: #1f2937;
        }
        .value.amount {
            font-size: 1.15rem;
            color: #111827;
            font-weight: 700;
        }

        /* Call To Action Buttons */
        .btn-group {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }
        .btn-primary {
            background-color: #111827;
            color: #ffffff;
            border: none;
            padding: 14px 24px;
            border-radius: 10px;
            font-size: 0.95rem;
            font-weight: 600;
            cursor: pointer;
            transition: background-color 0.2s;
            text-decoration: none;
        }
        .btn-primary:hover {
            background-color: #000000;
        }
        .btn-secondary {
            background: transparent;
            color: #4b5563;
            border: 1px solid #e5e7eb;
            padding: 14px 24px;
            border-radius: 10px;
            font-size: 0.95rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s;
            text-decoration: none;
        }
        .btn-secondary:hover {
            background-color: #f9fafb;
            color: #111827;
        }

        /* Simple Intro Scale Animation */
        @keyframes scaleIn {
            from { transform: scale(0.8); opacity: 0; }
            to { transform: scale(1); opacity: 1; }
        }
    </style>
</head>
<body>

    <!-- Main Payment Success Card Frame -->
    <div class="success-card">
        
        <!-- SVG Success Vector Icon -->
        <div class="icon-container">
            <svg xmlns="http://w3.org" fill="none" viewBox="0 0 24 24" stroke-width="2.5" stroke="currentColor">
                <path stroke-linecap="round" stroke-linejoin="round" d=" Vector M4.5 12.75l6 6 9-13.5" />
            </svg>
        </div>

        <h1 class="success-title">Payment Successful!</h1>
        <p class="success-subtitle">Thank you for your purchase. Your transaction has been completed and a receipt was sent to your email.</p>

        <!-- Dynamic Invoice Panel Details -->
        <div class="receipt-panel">
            <div class="receipt-row">
                <span class="label">Payment Status</span>
                <span class="value" style="color: #10b981;">Completed</span>
            </div>
            <div class="receipt-row">
                <span class="label">Transaction ID</span>
                <span class="value">#TXN-9824107</span>
            </div>
            <div class="receipt-row">
                <span class="label">Payment Method</span>
                <span class="value">Credit Card (•••• 4242)</span>
            </div>
            <div class="receipt-row">
                <span class="label">Amount Paid</span>
                <span class="value amount">$49.00</span>
            </div>
        </div>

        <!-- Navigation Context Closures -->
        <div class="btn-group">
            <a href="/dashboard" class="btn-primary">Go to Dashboard</a>
            <a href="/receipt/download" class="btn-secondary">Download PDF Receipt</a>
        </div>
    </div>

</body>
</html>
